rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      No icon in home-assistant/brands; Mira and Mira Mode are trademarks of
      their owners, so none is added here.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No requirements beyond what Home Assistant's Bluetooth stack ships.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: No entity subscribes to events; the coordinator pushes updates.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >-
      No credentials. A lost Bluetooth bond is fixed by re-pairing through
      the reconfigure flow.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: >-
      The Bluetooth address is the entry's unique id and the only connection
      detail, so discovery has nothing to update.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry is exactly one valve.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >-
      Nothing the user can repair from a prompt; a lost bond shows as
      unavailable entities and is fixed with reconfigure.
  stale-devices:
    status: exempt
    comment: Each config entry is exactly one valve; deleting the entry removes it.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: No HTTP; everything goes over Bluetooth.
  strict-typing: done
